name: Test published Linux preview

on: workflow_dispatch

permissions:
  contents: read

jobs:
  preview:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Fetch and verify the published archive
        run: |
          archive=Gatehouse-0.2.4-linux-x64.tar.gz
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" "https://github.com/M-KUMG/Gatehouse/releases/download/v0.2.4/$archive"
          cd "$RUNNER_TEMP"
          echo "58d3f5f4845edddb9d86e738204a4135f6b2954d8558ea08d448763d80a4bea7  $archive" | sha256sum --check
          tar -xzf "$archive"
          test -x Gatehouse-0.2.4-linux-x64/gatehouse
      - name: Configure the sandbox helper on Ubuntu 24.04
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo install -d -m 0755 /opt/gatehouse-preview-smoke
          sudo cp -a "$RUNNER_TEMP/Gatehouse-0.2.4-linux-x64/." /opt/gatehouse-preview-smoke/
          sudo chown -R root:root /opt/gatehouse-preview-smoke
          sudo chmod 4755 /opt/gatehouse-preview-smoke/chrome-sandbox
      - name: Run the packaged desktop app offline
        env:
          RUNNER_IMAGE: ${{ matrix.os }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth
          test_home="$RUNNER_TEMP/smoke-home"
          mkdir -p "$test_home"/{Documents,profile}
          sudo ip netns add gatehouse-smoke
          trap 'sudo ip netns del gatehouse-smoke' EXIT
          sudo ip -n gatehouse-smoke link set lo up
          sudo ip -n gatehouse-smoke -br address
          test -z "$(sudo ip -n gatehouse-smoke route show default)"
          app="$RUNNER_TEMP/Gatehouse-0.2.4-linux-x64/gatehouse"
          if [ "$RUNNER_IMAGE" = ubuntu-24.04 ]; then app=/opt/gatehouse-preview-smoke/gatehouse; fi
          sudo ip netns exec gatehouse-smoke runuser -u "$USER" -- env HOME="$test_home" PATH="$PATH" \
            xvfb-run -a --server-args="-screen 0 1440x1080x24" node scripts/linux-preview-smoke.mjs \
            "$app" "$test_home/profile"
